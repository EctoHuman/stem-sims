<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendulum & Energy Lab — Physics I</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-wrap: wrap; min-height: 100vh; padding: 1.25rem; gap: 1.25rem; }
    .canvas-wrap { flex: 1 1 560px; background: #090d16; border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    canvas { background: #0f172a; border: 1px solid #334155; border-radius: 8px; max-width: 100%; }
    .controls { flex: 0 1 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.35rem; display: flex; flex-direction: column; gap: 1rem; }
    h1 { font-size: 1.25rem; color: var(--accent); }
    .readout { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .stat { font-size: 0.8rem; color: var(--muted); }
    .stat strong { display: block; font-size: 1.1rem; color: var(--text); margin-top: 0.15rem; }
    label { font-size: 0.88rem; display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.25rem; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .btn-row { display: flex; gap: 0.6rem; margin-top: auto; }
    button, .back-link { flex: 1; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border); background: #334155; color: var(--text); font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.88rem; }
    button.primary { background: var(--accent); color: #0f172a; border: none; }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="pendCanvas" width="600" height="420"></canvas>
  </div>

  <aside class="controls">
    <h1>Pendulum & Energy Conservation</h1>
    <div class="readout">
      <div class="stat">Period (T = 2π√(L/g))<strong id="tVal">2.01 s</strong></div>
      <div class="stat">Current Angle (θ)<strong id="angVal">35.0°</strong></div>
    </div>

    <div>
      <label><span>String Length (L)</span><span id="lLbl">1.00 m</span></label>
      <input type="range" id="lSlider" min="0.4" max="2.0" step="0.1" value="1.0" />
    </div>

    <div>
      <label><span>Gravity (g)</span><span id="gLbl">9.81 m/s²</span></label>
      <input type="range" id="gSlider" min="1.6" max="24.8" step="0.1" value="9.8" />
    </div>

    <div>
      <label><span>Release Angle (θ₀)</span><span id="aLbl">35°</span></label>
      <input type="range" id="aSlider" min="5" max="80" step="1" value="35" />
    </div>

    <div class="btn-row">
      <button class="primary" id="playBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <a href="../index.html" class="back-link">← Hub</a>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById('pendCanvas');
    const ctx = canvas.getContext('2d');
    const lSlider = document.getElementById('lSlider');
    const gSlider = document.getElementById('gSlider');
    const aSlider = document.getElementById('aSlider');

    let theta = (35 * Math.PI) / 180;
    let omega = 0;
    let running = true;

    function resetSim() {
      theta = (parseFloat(aSlider.value) * Math.PI) / 180;
      omega = 0;
    }

    [lSlider, gSlider, aSlider].forEach(el => el.addEventListener('input', () => {
      if (el === aSlider) resetSim();
      document.getElementById('lLbl').textContent = parseFloat(lSlider.value).toFixed(2) + ' m';
      document.getElementById('gLbl').textContent = parseFloat(gSlider.value).toFixed(1) + ' m/s²';
      document.getElementById('aLbl').textContent = aSlider.value + '°';
    }));

    document.getElementById('playBtn').addEventListener('click', e => {
      running = !running;
      e.target.textContent = running ? 'Pause' : 'Play';
    });
    document.getElementById('resetBtn').addEventListener('click', resetSim);

    function step() {
      const L = parseFloat(lSlider.value);
      const g = parseFloat(gSlider.value);
      const dt = 1 / 60;

      if (running) {
        const alpha = -(g / L) * Math.sin(theta);
        omega += alpha * dt;
        theta += omega * dt;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pivotX = 250, pivotY = 60;
      const pxPerMeter = 155;
      const bobX = pivotX + Math.sin(theta) * (L * pxPerMeter);
      const bobY = pivotY + Math.cos(theta) * (L * pxPerMeter);

      // Pivot & String
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(pivotX - 40, pivotY); ctx.lineTo(pivotX + 40, pivotY); ctx.stroke();
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY); ctx.stroke();

      // Bob
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(bobX, bobY, 18, 0, Math.PI * 2); ctx.fill();

      // Energy Bars (K, U, Total)
      const h = L * (1 - Math.cos(theta));
      const v = L * omega;
      const U = g * h;
      const K = 0.5 * v * v;
      const E = Math.max(0.01, U + K);
      const maxH = 220;

      const bars = [
        { label: 'KE', val: K / E, color: '#34d399', x: 460 },
        { label: 'PE', val: U / E, color: '#c084fc', x: 505 },
        { label: 'Total', val: 1, color: '#f59e0b', x: 550 }
      ];
      bars.forEach(b => {
        const bh = Math.min(maxH, b.val * maxH);
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, 340 - bh, 28, bh);
        ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
        ctx.fillText(b.label, b.x, 360);
      });

      const period = 2 * Math.PI * Math.sqrt(L / g);
      document.getElementById('tVal').textContent = period.toFixed(2) + ' s';
      document.getElementById('angVal').textContent = ((theta * 180) / Math.PI).toFixed(1) + '°';

      requestAnimationFrame(step);
    }
    step();
  </script>
</body>
</html>
