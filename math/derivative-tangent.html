<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secant to Tangent Visualizer — Calculus I</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #c084fc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-wrap: wrap; min-height: 100vh; padding: 1.25rem; gap: 1.25rem; }
    .canvas-wrap { flex: 1 1 560px; background: #090d16; border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    canvas { background: #0f172a; border: 1px solid #334155; border-radius: 8px; max-width: 100%; }
    .controls { flex: 0 1 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.35rem; display: flex; flex-direction: column; gap: 1rem; }
    h1 { font-size: 1.25rem; color: var(--accent); }
    select, input[type="range"] { width: 100%; padding: 0.45rem; border-radius: 8px; background: #0f172a; color: var(--text); border: 1px solid var(--border); accent-color: var(--accent); }
    .readout { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .stat { font-size: 0.8rem; color: var(--muted); }
    .stat strong { display: block; font-size: 1.1rem; color: var(--text); margin-top: 0.15rem; }
    label { font-size: 0.88rem; display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.25rem; }
    .btn-row { display: flex; gap: 0.6rem; margin-top: auto; }
    button, .back-link { flex: 1; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border); background: #334155; color: var(--text); font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.88rem; }
    button.primary { background: var(--accent); color: #0f172a; border: none; }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="graph" width="600" height="420"></canvas>
  </div>

  <aside class="controls">
    <h1>Secant → Tangent Derivative</h1>
    <div>
      <label>Function f(x)</label>
      <select id="fnSelect">
        <option value="quad">f(x) = 0.25 x²</option>
        <option value="sin">f(x) = 2 sin(x)</option>
        <option value="cubic">f(x) = 0.1 x³ - 0.5x</option>
      </select>
    </div>

    <div class="readout">
      <div class="stat">Exact Tangent f'(x₀)<strong id="tanSlope" style="color:#34d399">1.000</strong></div>
      <div class="stat">Secant Slope m_sec<strong id="secSlope" style="color:#f59e0b">1.500</strong></div>
      <div class="stat">Step Size (Δx = h)<strong id="hRead">2.00</strong></div>
      <div class="stat">Slope Error |Δm|<strong id="errRead">0.500</strong></div>
    </div>

    <div>
      <label><span>Base Point (x₀)</span><span id="x0Lbl">1.00</span></label>
      <input type="range" id="x0Slider" min="-3" max="3" step="0.1" value="1.0" />
    </div>

    <div>
      <label><span>Step Size (Δx)</span><span id="hLbl">2.00</span></label>
      <input type="range" id="hSlider" min="0.01" max="3.0" step="0.01" value="2.0" />
    </div>

    <div class="btn-row">
      <button class="primary" id="limitBtn">Animate Δx → 0</button>
      <a href="../index.html" class="back-link">← Hub</a>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    const fnSelect = document.getElementById('fnSelect');
    const x0Slider = document.getElementById('x0Slider');
    const hSlider = document.getElementById('hSlider');

    const funcs = {
      quad: { f: x => 0.25 * x * x, df: x => 0.5 * x },
      sin: { f: x => 2 * Math.sin(x), df: x => 2 * Math.cos(x) },
      cubic: { f: x => 0.1 * x * x * x - 0.5 * x, df: x => 0.3 * x * x - 0.5 }
    };

    const scale = 55;
    const ox = canvas.width / 2;
    const oy = canvas.height / 2 + 30;
    const toScreen = (x, y) => [ox + x * scale, oy - y * scale];

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const { f, df } = funcs[fnSelect.value];
      const x0 = parseFloat(x0Slider.value);
      const h = parseFloat(hSlider.value);
      const x1 = x0 + h;
      const y0 = f(x0), y1 = f(x1);
      const mTan = df(x0);
      const mSec = (y1 - y0) / h;

      // Grid & Axes
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
      for (let i = -5; i <= 5; i++) {
        const [gx, gy] = toScreen(i, i);
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
      }
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, canvas.height); ctx.stroke();

      // Curve f(x)
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let px = 0; px <= canvas.width; px += 2) {
        const x = (px - ox) / scale;
        const [sx, sy] = toScreen(x, f(x));
        px === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      }
      ctx.stroke();

      // Exact Tangent Line (Green)
      ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath();
      [-6, 6].forEach((x, idx) => {
        const [sx, sy] = toScreen(x, y0 + mTan * (x - x0));
        idx === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      });
      ctx.stroke(); ctx.setLineDash([]);

      // Secant Line (Amber)
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      [-6, 6].forEach((x, idx) => {
        const [sx, sy] = toScreen(x, y0 + mSec * (x - x0));
        idx === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      });
      ctx.stroke();

      // Points P(x0, y0) and Q(x0+h, y1)
      [[x0, y0, '#34d399'], [x1, y1, '#f59e0b']].forEach(([x, y, color]) => {
        const [sx, sy] = toScreen(x, y);
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
      });

      document.getElementById('x0Lbl').textContent = x0.toFixed(2);
      document.getElementById('hLbl').textContent = h.toFixed(2);
      document.getElementById('tanSlope').textContent = mTan.toFixed(3);
      document.getElementById('secSlope').textContent = mSec.toFixed(3);
      document.getElementById('hRead').textContent = h.toFixed(2);
      document.getElementById('errRead').textContent = Math.abs(mSec - mTan).toFixed(3);
    }

    [fnSelect, x0Slider, hSlider].forEach(el => el.addEventListener('input', draw));

    document.getElementById('limitBtn').addEventListener('click', () => {
      const timer = setInterval(() => {
        let h = parseFloat(hSlider.value);
        if (h <= 0.03) { hSlider.value = 0.01; draw(); clearInterval(timer); return; }
        hSlider.value = (h * 0.92).toFixed(2);
        draw();
      }, 30);
    });

    draw();
  </script>
</body>
</html>
